<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>RKT TV</title>
<!--
  RKT TV — club TV display driven by Google Sheets.

  SETUP (full instructions were supplied with this file):
   1. Paste your master sheet link into CONFIG.MASTER_SHEET below.
   2. Master sheet columns: Club | Colour1 | Colour2 | Logo | PlayCricketID | Sheet | Folder (optional)
        Sheet  = link to that club's "RKT TV - <Club>" sheet
        Folder = link to that club's Drive folder (optional; defaults to the folder the club sheet is in)
   3. Club sheet columns: Order | Active | Type | Link | Filename | Length
        Type   = Ladder Link | Sponsor | Image
        Ladder Link: Link = grassroots ladder API URL; Filename (optional) = ladder name e.g. "One Day"
        Sponsor:     Link = image URL (web or Google Drive link)
        Image:       Filename = file name in the club's Drive folder (needs GOOGLE_API_KEY),
                     or paste the image's Google Drive share link into Link (no key needed)
        Gallery:     Link = a Google Drive folder link (shared "Anyone with the link: Viewer");
                     Details = how many images to show at once (default 1). Shows the next set each rotation.
        Honours:     Link = tab name (or link to a tab); Filename = title. One page per rotation.
        Length = seconds on screen
   4. Share every sheet/folder as "Anyone with the link: Viewer".
   5. Open  yourpage.html?club=Omega  on the TV (the club list links there). Add &debug to show skipped-slide messages.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --c1:14,22,58; --c1d:14,22,58; --c2:190,150,60; --accent:230,200,130; --onc2:255,255,255;
    --bg:#06070c; --ink:#f3f4f8; --muted:rgba(243,244,248,.6);
    --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* TV mode: 1rem = 1% of a 16:9 screen width, so everything scales with the display */
  html{font-size:min(1vw,1.7778vh)}
  /* Fixed-size mode for scoreboards: the display is drawn in a W x H box at the top-left */
  html.fixed{font-size:var(--fs0)}
  html.fixed body{background:#000}
  html.fixed .backdrop,html.fixed .tv{inset:auto;left:0;top:0;width:var(--W);height:var(--H)}
  html.fixed .backdrop{position:fixed;overflow:hidden}
  html.menu{font-size:16px}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,sans-serif}
  body{overflow:hidden}
  html.menu body{overflow:auto}
  a{color:inherit}

  .backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      repeating-linear-gradient(135deg,rgba(255,255,255,.022) 0 2px,transparent 2px 26px),
      radial-gradient(120vmax 80vmax at 0% -20%,rgba(var(--c1d),.95),transparent 62%),
      radial-gradient(90vmax 70vmax at 110% 120%,rgba(var(--c2),.5),transparent 60%),
      var(--bg);}

  /* ---------- Club list ---------- */
  .menu-wrap{position:relative;z-index:1;min-height:100%;padding:56px 24px 64px}
  .menu-head{max-width:1200px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .menu-head .kicker{font:700 14px var(--cond);letter-spacing:.35em;text-transform:uppercase;color:rgb(var(--accent))}
  .menu-head h1{font:800 clamp(40px,6vw,72px)/.95 var(--cond);text-transform:uppercase;letter-spacing:.01em}
  .menu-head p{color:var(--muted);font-size:15px;max-width:420px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;max-width:1200px;margin:36px auto 0}
  .card{--c1d:20,30,70;--c2:200,160,60;position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 20px 24px;border-radius:18px;text-decoration:none;color:#fff;overflow:hidden;
    background:linear-gradient(155deg,rgb(var(--c1d)) 0%,rgba(var(--c1d),.75) 55%,rgba(var(--c2),.55) 100%);
    box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08);
    transition:transform .18s ease,box-shadow .18s ease}
  .card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:rgb(var(--c2))}
  .card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.35);outline:none}
  .card .logo{width:124px;height:124px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .card .logo img{max-width:78%;max-height:78%;object-fit:contain}
  .card .logo span{font:800 44px var(--cond);color:rgb(var(--c1d))}
  .card .name{font:700 26px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;text-align:center}
  .card .go{font-size:13px;color:rgba(255,255,255,.7);letter-spacing:.08em;text-transform:uppercase}

  /* ---------- TV ---------- */
  .tv{position:fixed;inset:0;z-index:1;display:grid;grid-template-rows:1fr auto;grid-template-columns:minmax(0,1fr)}
  .stage{position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transform:scale(1.015);transition:opacity .9s ease,transform 1.2s ease}
  .slide.on{opacity:1;transform:none}

  .bar{position:relative;display:flex;align-items:center;gap:1.2rem;padding:.8rem 2.2rem;
    background:linear-gradient(90deg,rgba(var(--c1d),.96),rgba(var(--c1d),.7) 60%,rgba(0,0,0,.6));
    border-top:.28rem solid rgb(var(--c2))}
  .progress{position:absolute;left:0;top:-.28rem;height:.28rem;width:0;background:rgb(var(--accent))}
  .bar .blogo{height:3.6rem;width:3.6rem;object-fit:contain}
  .bar .club{font:700 2.1rem/1 var(--cond);letter-spacing:.08em;text-transform:uppercase}
  .dots{display:flex;gap:.55rem;margin-left:auto}
  .bar.has-ticker .dots{margin-left:0}
  .bar.has-ticker .club{display:none}

  /* Scores ticker */
  .ticker{flex:1;min-width:0;height:3.6rem;overflow:hidden;position:relative;display:flex;align-items:center;margin:0 .6rem;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
  .tk-track{display:flex;width:max-content;will-change:transform;animation:tk var(--tkdur,60s) linear infinite}
  .tk-set{display:flex;align-items:center;flex:0 0 auto}
  @keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tk-item{display:inline-flex;align-items:center;gap:.8rem;white-space:nowrap;font:500 1.75rem/1 "Barlow",sans-serif;padding-right:1.4rem}
  .tk-sep{color:rgb(var(--accent));opacity:.7;font-size:1rem;padding-right:1.4rem}
  .tk-badge{font:700 1.3rem/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;padding:.4rem .8rem;border-radius:.4rem;background:rgba(255,255,255,.14)}
  .tk-badge.live{background:#d7263d;color:#fff;display:inline-flex;align-items:center;gap:.45rem}
  .tk-badge.live::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:#fff;animation:pulse 1.2s ease-in-out infinite}
  .tk-badge.prog{background:#b86e00;color:#fff}
  .tk-badge.won{background:#1f8a4c;color:#fff}
  .tk-badge.lost{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
  .tk-badge.draw{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
  .tk-grade{font:600 1.35rem/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--accent))}
  .tk-team{color:rgba(255,255,255,.82)}
  .tk-team.me{color:#fff;font-weight:700}
  .tk-team b{font:700 1.95rem/1 var(--cond);letter-spacing:.02em;margin-left:.35rem;color:#fff}
  .tk-v{color:var(--muted);font-size:1.4rem}
  .tk-res{color:var(--muted);font-style:italic}
  .tk-pl{display:inline-flex;align-items:center;gap:.9rem;padding-left:1rem;margin-left:.2rem;border-left:.15rem solid rgba(255,255,255,.2)}
  .tk-bat{color:#fff}
  .tk-bat b,.tk-bowl b{font:700 1.85rem/1 var(--cond);margin-left:.3rem}
  .tk-bat small,.tk-bowl small{font-size:1.3rem;color:var(--muted);margin-left:.2rem}
  .tk-bat.strike::before{content:"";display:inline-block;width:0;height:0;border-left:.7rem solid rgb(var(--accent));border-top:.45rem solid transparent;border-bottom:.45rem solid transparent;margin-right:.45rem;vertical-align:.1rem}
  .tk-bowl{color:rgba(255,255,255,.88)}
  .tk-bowl i{font:600 1.25rem/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;font-style:normal;color:var(--muted);margin-right:.4rem}
  @keyframes pulse{50%{opacity:.25}}
  .dot{width:.75rem;height:.75rem;border-radius:50%;background:rgba(255,255,255,.22);transition:background .4s,transform .4s}
  .dot.on{background:rgb(var(--accent));transform:scale(1.25)}
  .clock{font:600 2.3rem/1 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.04em;min-width:7.5rem;text-align:right}

  /* Ladder */
  .ladder{padding:2.6rem 3.2rem 1.8rem;display:flex;flex-direction:column}
  .l-head{display:flex;align-items:center;gap:1.6rem;margin-bottom:1.5rem}
  .l-head .org{height:5.6rem;width:5.6rem;border-radius:.8rem;background:#fff;object-fit:contain;padding:.3rem;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.4)}
  .l-kicker{font:700 1.35rem var(--cond);letter-spacing:.3em;text-transform:uppercase;color:rgb(var(--accent));margin-bottom:.35rem}
  .l-title{font:800 4.4rem/.92 var(--cond);text-transform:uppercase;letter-spacing:.01em}
  .l-meta{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
  .chip{font:700 1.5rem/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;padding:.6rem 1.2rem;border-radius:99rem;background:rgb(var(--c2));color:rgb(var(--onc2))}
  .l-upd{font-size:1.05rem;color:var(--muted)}
  .l-table{--fs:24px;flex:1;min-height:0;display:flex;flex-direction:column;gap:.28em;font-size:var(--fs)}
  .l-row{display:grid;grid-template-columns:var(--cols);align-items:center;flex:1;min-height:0;padding:0 .9em;border-radius:.35em;background:rgba(255,255,255,.05)}
  .l-row.alt{background:rgba(255,255,255,.085)}
  .l-row.th{flex:0 0 auto;background:none;padding-bottom:.1em;font:600 .62em var(--cond);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  .l-row.me{background:linear-gradient(90deg,rgb(var(--c2)),rgba(var(--c2),.75) 60%,rgba(var(--c1d),.9));color:rgb(var(--onc2));box-shadow:0 .25em .9em rgba(0,0,0,.45),inset 0 0 0 .08em rgba(255,255,255,.35)}
  .rank{font:800 1.15em/1 var(--cond)}
  .team{display:flex;align-items:center;gap:.7em;min-width:0;font-weight:600}
  .team img{flex:0 0 auto;height:1.55em;width:1.55em;border-radius:50%;background:#fff;object-fit:contain}
  .team span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .num{text-align:center;font-variant-numeric:tabular-nums}
  .th .num{font-variant-numeric:normal}
  .pts{font:800 1.12em/1 var(--cond)}

  /* Sponsor */
  .sponsor{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2rem;padding:3rem}
  .s-kicker{display:flex;align-items:center;gap:2.2rem;font:700 2.6rem/1 var(--cond);letter-spacing:.34em;text-transform:uppercase;color:rgb(var(--accent))}
  .s-kicker::before,.s-kicker::after{content:"";width:9rem;height:.22rem;background:currentColor;opacity:.55}
  .s-panel{background:#fff;border-radius:1.8rem;padding:3.5rem 4.5rem;box-shadow:0 2.5rem 6rem rgba(0,0,0,.55),0 0 0 .4rem rgba(var(--c2),.9)}
  .s-panel img{display:block;width:66rem;height:27rem;object-fit:contain}
  .sponsor:has(.s-details){gap:2.4rem}
  .s-details{display:flex;flex-direction:column;align-items:center;gap:.7rem;text-align:center;max-width:80rem}
  .s-details div{font:500 2.3rem/1.25 "Barlow",sans-serif;color:rgba(255,255,255,.82)}
  .s-details div.first{font:700 3.2rem/1.1 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:#fff}

  /* Image */
  .image .blur{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(3rem) brightness(.42) saturate(1.2)}
  .image .main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

  /* Honours */
  .honours{padding:2.6rem 3.2rem 1.8rem;display:flex;flex-direction:column}
  .h-head{display:flex;align-items:center;gap:1.6rem;margin-bottom:1.6rem;flex:0 0 auto}
  .h-head .clogo{height:5.6rem;width:5.6rem;border-radius:.8rem;background:#fff;object-fit:contain;padding:.35rem;box-shadow:0 .5rem 1.5rem rgba(0,0,0,.4)}
  .h-meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
  .h-body{--k:1;flex:1;min-height:0;overflow:hidden;font-size:calc(1rem * var(--k));position:relative}
  .h-rule{height:.22rem;background:linear-gradient(90deg,rgb(var(--c2)),rgba(var(--c2),0));margin:-.6rem 0 1.4rem;flex:0 0 auto}
  /* board (list) */
  .h-body.board{display:flex;flex-direction:column;justify-content:center}
  .h-board{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows),minmax(min-content,1fr));grid-template-columns:repeat(var(--cols),minmax(0,1fr));column-gap:2.4em;row-gap:.7em;height:min(100%,calc(var(--rows) * 7.5em))}
  .h-row{display:flex;align-items:center;gap:.9em;min-width:0;padding:.55em .9em;border-radius:.5em;background:rgba(255,255,255,.05);border-left:.28em solid rgba(var(--c2),.85)}
  .h-no{flex:0 0 auto;min-width:1.9em;font:700 1.9em/1 var(--cond);color:rgb(var(--accent));text-align:right}
  .h-thumb{flex:0 0 auto;width:4.4em;height:4.4em;border-radius:50%;object-fit:cover;background:rgba(var(--c1d),1);box-shadow:0 0 0 .18em rgba(var(--c2),.9)}
  .h-mono{flex:0 0 auto;width:4.4em;height:4.4em;border-radius:50%;display:grid;place-items:center;background:rgba(var(--c2),.9);color:rgb(var(--onc2));box-shadow:0 0 0 .18em rgba(var(--c2),.9)}
  .h-mono span{font:700 1.7em/1 var(--cond)}
  .h-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25em}
  .h-name{font:600 var(--nfs,2.25em)/1.1 "Barlow",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .h-award{font:600 1.35em/1.15 var(--cond);letter-spacing:.1em;text-transform:uppercase;color:rgb(var(--accent));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .h-board.tight .h-name{font:600 2.35em/1.1 var(--cond);letter-spacing:.01em}
  .h-year{flex:0 0 auto;font:700 2em/1 var(--cond);font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85);padding-left:.4em}
  /* feature (cards) */
  .h-feat{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:2.2em;height:100%;align-items:stretch}
  .h-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9em;padding:2.2em 2em;border-radius:1.4em;
    background:linear-gradient(180deg,rgba(var(--c1d),.92),rgba(0,0,0,.35));box-shadow:0 1em 3em rgba(0,0,0,.45),inset 0 0 0 .1em rgba(255,255,255,.08);border-top:.45em solid rgb(var(--c2))}
  .h-card .h-photo{width:14em;height:14em;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 .4em rgb(var(--c2)),0 1em 2em rgba(0,0,0,.5);flex:0 0 auto}
  .h-card .h-mono{width:14em;height:14em;box-shadow:0 0 0 .4em rgb(var(--c2)),0 1em 2em rgba(0,0,0,.5)}
  .h-card .h-mono span{font:800 5em/1 var(--cond)}
  .h-card .h-cname{font:800 3.2em/1 var(--cond);text-transform:uppercase;letter-spacing:.02em;margin-top:.3em}
  .h-card .h-award{font-size:1.5em;white-space:normal}
  .h-card ul{list-style:none;display:flex;flex-direction:column;gap:.45em;margin-top:.4em;width:100%}
  .h-card li{font:500 1.55em/1.25 "Barlow",sans-serif;color:rgba(255,255,255,.86);padding-bottom:.45em;border-bottom:.08em solid rgba(255,255,255,.1)}
  .h-card li:last-child{border-bottom:0}
  .h-card li strong{color:#fff;font-weight:700}

  /* Gallery */
  .g-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));gap:1rem;padding:1.4rem}
  .g-grid.one{padding:0;gap:0}
  .g-tile{position:relative;overflow:hidden;border-radius:.9rem;background:rgba(0,0,0,.35);box-shadow:0 .6rem 1.6rem rgba(0,0,0,.45)}
  .g-grid.one .g-tile{border-radius:0;box-shadow:none;background:none}
  .g-tile .blur{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(2.4rem) brightness(.45) saturate(1.2)}
  .g-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  /* Paused badge */
  .paused{position:fixed;top:14px;right:14px;z-index:6;font:700 14px "Barlow",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:99px;background:rgba(215,38,61,.92);color:#fff;display:none}
  body.is-paused .paused{display:block}
  html.fixed .paused{right:auto;left:calc(var(--W) - 140px)}

  /* RKT Sport branding */
  .brand{display:flex;align-items:center;gap:20px}
  .brand-badge{flex:0 0 auto;background:#fff;border-radius:18px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .brand-badge img{display:block;height:64px;width:auto;max-width:200px;object-fit:contain}
  .brand-badge .txt{font:800 28px/64px var(--cond);color:#0b0d18;letter-spacing:.04em}
  .menu-foot{max-width:1200px;margin:48px auto 0;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;color:var(--muted);font-size:14px}
  .menu-foot a{color:rgb(var(--accent));text-decoration:none}
  .menu-foot a:hover{text-decoration:underline}

  .splash{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.2rem;padding:3rem 4rem;
    background:radial-gradient(70rem 40rem at 50% 38%,rgba(255,255,255,.07),transparent 70%),linear-gradient(160deg,#10131f 0%,#07080d 100%)}
  .splash .sp-badge{background:#fff;border-radius:2.4rem;padding:2rem 3rem;box-shadow:0 2.5rem 6rem rgba(0,0,0,.6)}
  .splash .sp-badge img{display:block;height:13rem;width:auto;max-width:48rem;object-fit:contain}
  .splash .sp-badge .txt{font:800 8rem/13rem var(--cond);color:#0b0d18;letter-spacing:.04em}
  .splash h2{font:800 5.8rem/.95 var(--cond);text-transform:uppercase;letter-spacing:.01em;color:#fff}
  .splash p{font:500 2.6rem/1.25 "Barlow",sans-serif;color:rgba(255,255,255,.72);max-width:70rem;margin-top:-1rem}
  .splash .sp-mail{font:600 2.4rem/1 "Barlow",sans-serif;padding:1.1rem 2.4rem;border-radius:99rem;border:.18rem solid rgba(255,255,255,.35);color:#fff;letter-spacing:.02em}
  .splash.on .sp-badge{animation:spIn 1.1s cubic-bezier(.2,.8,.2,1) both}
  .splash.on h2,.splash.on p,.splash.on .sp-mail{animation:spUp .9s cubic-bezier(.2,.8,.2,1) both}
  .splash.on h2{animation-delay:.25s}.splash.on p{animation-delay:.4s}.splash.on .sp-mail{animation-delay:.55s}
  @keyframes spIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes spUp{from{opacity:0;transform:translateY(1.5rem)}to{opacity:1;transform:none}}

  /* Notices, controls, toast */
  .notice{position:relative;z-index:1;height:100%;display:grid;place-items:center;padding:24px}
  .notice .box{max-width:560px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:28px 30px;font-size:16px;line-height:1.5}
  .notice h2{font:800 32px/1.05 var(--cond);text-transform:uppercase;margin-bottom:10px}
  .notice p{color:var(--muted)}
  .notice a{display:inline-block;margin-top:16px;color:rgb(var(--accent))}
  .stage .notice .box{font-size:1.4rem;max-width:60rem;padding:2.5rem 3rem}
  .stage .notice h2{font-size:3rem}

  .ctrl{position:fixed;top:14px;left:14px;z-index:5;display:flex;gap:8px;opacity:0;transition:opacity .3s;pointer-events:none}
  body.awake .ctrl{opacity:1;pointer-events:auto}
  body.tv-mode:not(.awake){cursor:none}
  .btn{font:600 14px "Barlow",sans-serif;padding:8px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.6);color:#fff;cursor:pointer;text-decoration:none}
  .btn:hover{background:rgba(0,0,0,.8)}
  body.panel-open .ctrl,body.is-paused .ctrl{opacity:1;pointer-events:auto}
  body.is-paused.tv-mode{cursor:default}

<body>
<div id="app"></div>
<script>
/* ==================== CONFIG — edit these ==================== */
const CONFIG = {
  // Link (or ID) of the "RKT TV Master" sheet
  MASTER_SHEET: "https://docs.google.com/spreadsheets/d/1y_C9meoz1ifgBcsJ1fJjPN87-5RKcPam81NvFmAE-6Q/edit?usp=sharing",
  // Only needed for Image rows that give a Filename (looks the file up in the club's Drive folder).
  // Leave blank if Image rows use a Google Drive share link in the Link column instead.
  GOOGLE_API_KEY: "AIzaSyC-i38xOyYQItTkBf7XbgQBQM0xVolgCCQ",
  DEFAULT_SECONDS: 10,     // used when Length is blank
  GALLERY_MAX: 24,         // most images a Gallery slide will show at once
  IMAGE_STORE_MB: 400,     // images kept on this device between visits (least-recently-shown are dropped first).
                           // The browser may allow less on small devices; 0 turns the store off.
  PAUSE_RESUME_MINUTES: 5, // a paused screen carries on by itself after this long (0 = stay paused)
  REFRESH_MINUTES: 5,      // how often sheet changes are picked up (checked at the end of each rotation)
  LADDER_CACHE_MINUTES: 15,
  SPONSOR_HEADING: "Proudly sponsored by",
  // RKT Sport branding: logo on the club list, and a splash slide after every Nth full rotation
  // Scores ticker in the bottom bar (uses the club's PlayCricketID from the master sheet)
  TICKER: true,
  TICKER_REFRESH_MINUTES: 3,          // on match days
  TICKER_IDLE_REFRESH_MINUTES: 30,    // days with no club games
  TICKER_LIVE_REFRESH_SECONDS: 20,    // while a club game is live: live scorecards (scores, batters, bowler) refresh this often;
                                      // the full check of all grades still runs every TICKER_REFRESH_MINUTES
  TICKER_SPEED: 9,          // scroll speed (bigger = faster)
  // Tried in order; the first that loads is used everywhere. "rkt-logo.png" = a copy uploaded next to index.html (most reliable).
  RKT_LOGO: [
    "rkt-logo.png",
    "https://rktsport.wordpress.com/wp-content/uploads/2023/02/rkt-cut-out-1.png",
    "https://rktsport.files.wordpress.com/2023/02/rkt-cut-out-1.png",
    "https://i0.wp.com/rktsport.wordpress.com/wp-content/uploads/2023/02/rkt-cut-out-1.png"
  ],
  RKT_EMAIL: "rktsportau@gmail.com",
  SPLASH_EVERY: 2,          // show the splash once every 2 full rotations (0 = never)
  SPLASH_SECONDS: 10,
  // The cricket ladder service only lets its own website read it directly, so the page falls back to
  // public relays (tried in order; the first one that works is remembered). Put your own relay first
  // here if you set one up later. The ladder URL is added (encoded) to the end of each.
  LADDER_PROXIES: [
    "https://corsproxy.io/?url=",
    "https://api.allorigins.win/raw?url=",
    "https://api.codetabs.com/v1/proxy/?quest="
  ]
};
/* ============================================================= */

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const DEBUG = params.has("debug");

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
const isActive = v => !["", "0", "false", "no", "n", "off"].includes(String(v ?? "").trim().toLowerCase());

function sheetIdOf(v){ v = String(v || "").trim(); const m = v.match(/\/d\/([\w-]{20,})/); return m ? m[1] : v; }
function folderIdOf(v){ v = String(v || "").trim(); const m = v.match(/folders\/([\w-]{10,})/) || v.match(/[?&]id=([\w-]{10,})/); return m ? m[1] : v; }
function driveFileIdOf(url){
  url = String(url || "");
  if (!/(drive|docs)\.google\.com|googleusercontent\.com/i.test(url)) return null;
  const m = url.match(/\/d\/([\w-]{10,})/) || url.match(/[?&]id=([\w-]{10,})/);
  return m ? m[1] : null;
}
const driveImg = id => `https://drive.google.com/thumbnail?id=${id}&sz=w1920`;
const driveImgAlt = id => `https://lh3.googleusercontent.com/d/${id}=w2560`;
// Wix serves resized copies; strip the /v1/... part to get the full-resolution original for the TV
const fullRes = url => String(url || "").trim().replace(/^(https?:\/\/static\.wixstatic\.com\/media\/[^\/?#]+)\/v1\/.*$/i, "$1");
// Ask Wix for a copy sized for the TV instead of the full original (saves bandwidth and TV memory).
// The original is used automatically if the sized copy fails (see data-alt / loadAny).
function sized(url, w, h){
  const full = fullRes(url), m = full.match(/^https?:\/\/static\.wixstatic\.com\/media\/([^\/?#]+)$/i);
  return m ? `${full}/v1/fit/w_${w},h_${h},q_90/${m[1]}` : full;
}

function parseColour(v, fallback){
  v = String(v || "").trim();
  let m = v.match(/^#?([0-9a-f]{6})$/i);
  if (m) return [0, 2, 4].map(i => parseInt(m[1].substr(i, 2), 16));
  m = v.match(/(\d{1,3})\D+(\d{1,3})\D+(\d{1,3})/);
  if (m) return [m[1], m[2], m[3]].map(x => Math.min(255, +x));
  return fallback;
}
function lum(c){ const f = x => { x /= 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; }; return .2126*f(c[0]) + .7152*f(c[1]) + .0722*f(c[2]); }
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function lightenTo(c, target){ let t = 0, x = c; while (lum(x) < target && t < 1){ t += .08; x = mix(c, [255,255,255], t); } return x; }
function darkenTo(c, target){ let t = 0, x = c; while (lum(x) > target && t < 1){ t += .08; x = mix(c, [0,0,0], t); } return x; }
function themeVars(club){
  const c1d = darkenTo(club.c1, .06);            // dark enough to sit white text on
  const accent = lightenTo(club.c2, .32);         // readable on the dark background
  const onc2 = lum(club.c2) > .4 ? [15,15,20] : [255,255,255];
  return { "--c1": club.c1.join(","), "--c1d": c1d.join(","), "--c2": club.c2.join(","), "--accent": accent.join(","), "--onc2": onc2.join(",") };
}
function applyTheme(el, club){ for (const [k, v] of Object.entries(themeVars(club))) el.style.setProperty(k, v); }
const varStyle = club => Object.entries(themeVars(club)).map(([k, v]) => `${k}:${v}`).join(";");

let toastTimer;
window.warn = warn;
function warn(msg){
  console.warn("[RKT TV]", msg);
  if (!DEBUG) return;
  const t = document.getElementById("toast"); if (!t) return;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 6000);
}

/* ---------- Google Sheets (read-only, via the public "view" endpoint) ---------- */
// Loads the sheet as a <script> (JSONP) so it works from any website, from a local file,
// and regardless of which Google account the browser is signed into. Falls back to fetch.
let jsonpSeq = 0;
function sheetJsonp(id, extra = ""){
  return new Promise((ok, fail) => {
    const cb = "__rktSheet" + (++jsonpSeq);
    const s = document.createElement("script");
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); fail(new Error("timeout")); }, 20000);
    window[cb] = data => { done(); ok(data); };
    s.onerror = () => { done(); fail(new Error("script error")); };
    s.src = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1${extra}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
async function sheetFetch(id, extra = ""){
  const res = await fetch(`https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/gviz/tq?tqx=out:json&headers=1${extra}&_=${Date.now()}`, { cache: "no-store", credentials: "omit" });
  const text = await res.text();
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0) throw new Error("not JSON");
  return JSON.parse(text.slice(a, b + 1));
}
// tab: { gid } or { sheet: "Tab name" } to read a tab other than the first. A gid in the link is used automatically.
async function readSheet(idOrUrl, tab = {}){
  const id = sheetIdOf(idOrUrl);
  const gid = tab.gid ?? (String(idOrUrl).match(/[#?&]gid=(\d+)/) || [])[1];
  const extra = tab.sheet ? `&sheet=${encodeURIComponent(tab.sheet)}` : gid != null ? `&gid=${gid}` : "";
  let data;
  try { data = await sheetJsonp(id, extra); }
  catch (e1) {
    try { data = await sheetFetch(id, extra); }
    catch (e2) { throw new Error(`Couldn't open sheet ${id}. Check it's shared as "Anyone with the link: Viewer" and that this device can reach docs.google.com.`); }
  }
  if (data.status === "error") throw new Error((data.errors?.[0]?.detailed_message || data.errors?.[0]?.message || "Sheet error") + ` (${id})`);
  const cols = data.table.cols.map(c => String(c.label || "").trim().toLowerCase());
  return data.table.rows.map(r => {
    const o = {};
    cols.forEach((k, i) => { const c = r.c && r.c[i]; o[k] = c == null ? "" : (c.v ?? c.f ?? ""); });
    return o;
  });
}

/* ---------- Google Drive (only used for Filename lookups) ---------- */
async function driveGet(url){
  const res = await fetch(url);
  const j = await res.json().catch(() => ({}));
  if (!res.ok || j.error) throw new Error("Google Drive: " + (j.error?.message || res.status));
  return j;
}
async function listClubFolder(club){
  const key = CONFIG.GOOGLE_API_KEY;
  if (!key) throw new Error("Image rows that use a Filename need GOOGLE_API_KEY set (or paste the image's Drive share link into Link instead).");
  let folder = club.folder ? folderIdOf(club.folder) : "";
  if (!folder){
    const f = await driveGet(`https://www.googleapis.com/drive/v3/files/${sheetIdOf(club.sheet)}?fields=parents&supportsAllDrives=true&key=${key}`);
    folder = f.parents?.[0];
    if (!folder) throw new Error(`Couldn't find ${club.name}'s folder. Add its link to the master sheet's "Folder" column.`);
  }
  const files = []; let token = "";
  do {
    const q = encodeURIComponent(`'${folder}' in parents and trashed=false`);
    const j = await driveGet(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,mimeType)&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true&key=${key}${token ? "&pageToken=" + token : ""}`);
    files.push(...(j.files || [])); token = j.nextPageToken || "";
  } while (token);
  return files;
}
function findFile(files, name){
  const n = name.trim().toLowerCase(), base = s => s.replace(/\.[a-z0-9]{2,5}$/i, "");
  return files.find(f => f.name.toLowerCase() === n) || files.find(f => base(f.name.toLowerCase()) === base(n));
}

/* ---------- data model ---------- */
function clubFromRow(r){
  return {
    name: String(r.club).trim(),
    c1: parseColour(r.colour1 || r.color1, [14,22,58]),
    c2: parseColour(r.colour2 || r.color2, [190,150,60]),
    logo: sized(r.logo, 400, 400),
    logoAlt: fullRes(r.logo),
    pcId: String(r.playcricketid || "").trim().toLowerCase(),
    sheet: String(r.sheet || r["sheet link"] || r["sheet id"] || "").trim(),
    folder: String(r.folder || r["folder link"] || r["folder id"] || "").trim()
  };
}

let buildIssues = [];
async function buildSlides(club){
  buildIssues = [];
  const warn = m => { buildIssues.push(m); window.warn(m); };
  if (!club.sheet) throw new Error(`Add the link to ${club.name}'s sheet in the master sheet's "Sheet" column.`);
  const rows = await readSheet(club.sheet);
  const list = rows.map((r, i) => ({ r, i }))
    .filter(({ r }) => r.type && isActive(r.active))
    .sort((a, b) => (num(a.r.order, 1e9) - num(b.r.order, 1e9)) || a.i - b.i);
  const slides = []; let folderFiles = null;
  for (const { r } of list){
    const type = String(r.type).toLowerCase().replace(/[^a-z]/g, "");
    const secs = Math.max(3, num(r.length, CONFIG.DEFAULT_SECONDS));
    const link = String(r.link || "").trim(), fname = String(r.filename || "").trim();
    if (type.startsWith("ladder")){
      const url = ladderUrl(link);
      if (url) slides.push({ kind: "ladder", url, ladderName: fname, secs });
      else if (link) warn(`Ladder "${link}" isn't a grade ID or ladder link — skipped.`);
    } else if (type === "sponsor" || type === "image"){
      let src, alt = null;
      const dId = driveFileIdOf(link);
      if (dId){ src = driveImg(dId); alt = driveImgAlt(dId); }
      else if (/^https?:\/\//i.test(link)){ src = sized(link, type === "image" ? 1920 : 1400, type === "image" ? 1080 : 700); alt = fullRes(link); }
      else {
        const name = fname || link; if (!name) continue;
        if (!folderFiles){ try { folderFiles = await listClubFolder(club); } catch (e){ warn(e.message); folderFiles = []; } }
        const f = findFile(folderFiles, name);
        if (!f){ warn(`"${name}" isn't in ${club.name}'s folder — skipped.`); continue; }
        src = driveImg(f.id); alt = driveImgAlt(f.id);
      }
      slides.push({ kind: type, src, alt, secs, details: String(r.details || r.detail || "").trim() });
    } else if (type === "gallery"){
      const per = Math.max(1, Math.min(CONFIG.GALLERY_MAX, parseInt(String(r.details ?? "").trim(), 10) || 1));
      try {
        const files = await galleryFiles(link);
        if (!files.length) throw new Error("no images found in the folder");
        slides.push({ kind: "gallery", key: "g|" + link, files, per, secs });
      } catch (e){ warn(`Gallery: ${e.message}`); }
    } else if (/^hono(u)?r|^lifemember|^awards?$/.test(type)){
      try { slides.push(...await honoursSlides(club, link, fname, secs)); }
      catch (e){ warn(`Honours "${fname || link}": ${e.message}`); }
    } else warn(`Unknown Type "${r.type}" — skipped.`);
  }
  return slides;
}

/* ---------- gallery ---------- */
const galleryLists = new Map();   // folder -> { t, files } (listing re-read every 30 min)
const IMG_EXT = /\.(jpe?g|png|webp|gif|avif|bmp|heic|heif)$/i;
async function galleryFiles(link){
  const folder = folderIdOf(link);
  if (!/^[\w-]{10,}$/.test(folder)) throw new Error("Link needs to be a Google Drive folder link");
  const hit = galleryLists.get(folder);
  if (hit && Date.now() - hit.t < 30 * 60e3) return hit.files;
  let files = [], html = "";
  try {
    if (CONFIG.GOOGLE_API_KEY){
      let token = "";
      do {
        const q = encodeURIComponent(`'${folder}' in parents and trashed=false and mimeType contains 'image/'`);
        const j = await driveGet(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=name&fields=nextPageToken,files(id,name)&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true&key=${CONFIG.GOOGLE_API_KEY}${token ? "&pageToken=" + token : ""}`);
        files.push(...(j.files || [])); token = j.nextPageToken || "";
      } while (token);
    } else {
      // No API key: read Drive's public "embedded folder" page (via the relays) and pick out the files
      try { html = await apiText(`https://drive.google.com/embeddedfolderview?id=${folder}`, t => /flip-entry|\/file\/d\//.test(t)); }
      catch (e){ throw new Error(`couldn't read the Drive folder list (${e.message}). Check the folder is shared "Anyone with the link: Viewer". For reliable galleries, set GOOGLE_API_KEY.`); }
      for (const m of html.matchAll(/id="entry-([\w-]{20,})"[\s\S]*?flip-entry-title">([^<]*)</g)){
        const id = m[1], name = m[2].replace(/&amp;/g, "&").replace(/&#39;/g, "'").trim();
        if (html.includes(`/folders/${id}`) && !html.includes(`/file/d/${id}`)) continue;   // skip sub-folders
        if (name && /\.[a-z0-9]{2,5}$/i.test(name) && !IMG_EXT.test(name)) continue;       // skip non-images
        if (!files.some(f => f.id === id)) files.push({ id, name });
      }
    }
    if (!files.length && !CONFIG.GOOGLE_API_KEY){
      // Fallback: any file links on the page
      for (const m of html.matchAll(/\/file\/d\/([\w-]{20,})/g)) if (!files.some(f => f.id === m[1])) files.push({ id: m[1], name: "" });
    }
  } catch (e){ if (hit) return hit.files; throw e; }
  files.sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { numeric: true, sensitivity: "base" }));
  galleryLists.set(folder, { t: Date.now(), files });
  return files;
}
// Best grid for n photos in the stage (maximises photo size, assuming roughly 3:2 photos)
function galleryGrid(n, W, H){
  let best = { cols: 1, rows: n, a: 0 };
  for (let cols = 1; cols <= n; cols++){
    const rows = Math.ceil(n / cols), tw = W / cols, th = H / rows, w = Math.min(tw, th * 1.5), a = w * (w / 1.5);
    if (a > best.a) best = { cols, rows, a };
  }
  return best;
}
const galleryUrls = (id, cols) => { const w = cols >= 3 ? 800 : cols === 2 ? 1280 : 1920; return { src: `https://lh3.googleusercontent.com/d/${id}=w${w}`, alt: `https://drive.google.com/thumbnail?id=${id}&sz=w${w}` }; };
function galleryPick(s, page){ const out = []; for (let i = 0; i < s.per && i < s.files.length; i++) out.push(s.files[(page * s.per + i) % s.files.length]); return out; }

/* ---------- on-device image store ---------- */
// Keeps downloaded images in the browser's Cache Storage so they survive reloads, up to IMAGE_STORE_MB.
// Only works where the image host allows it (CORS); otherwise the browser's normal cache is used.
const STORE = "rkttv-images-v1", STORE_IDX = "rkttv-images-idx";
const storeOn = () => CONFIG.IMAGE_STORE_MB > 0 && typeof caches !== "undefined" && window.isSecureContext;
const corsBad = new Set();
let storeIdx = null, storeLimit = null, idxTimer = null;
function idx(){ if (!storeIdx){ try { storeIdx = JSON.parse(localStorage.getItem(STORE_IDX) || "{}"); } catch (e){ storeIdx = {}; } } return storeIdx; }
function saveIdx(){ clearTimeout(idxTimer); idxTimer = setTimeout(() => { try { localStorage.setItem(STORE_IDX, JSON.stringify(storeIdx)); } catch (e){} }, 2000); }
async function limitBytes(){
  if (storeLimit !== null) return storeLimit;
  let lim = CONFIG.IMAGE_STORE_MB * 1048576;
  try { const est = await navigator.storage.estimate(); if (est.quota) lim = Math.min(lim, est.quota * 0.5); } catch (e){}
  try { navigator.storage.persist && navigator.storage.persist(); } catch (e){}
  return (storeLimit = lim);
}
async function trimStore(c){
  const ix = idx(), lim = await limitBytes();
  let total = Object.values(ix).reduce((a, v) => a + (v[0] || 0), 0);
  if (total <= lim) return;
  for (const [u] of Object.entries(ix).sort((a, b) => a[1][1] - b[1][1])){
    if (total <= lim * 0.9) break;
    total -= ix[u][0] || 0; delete ix[u]; try { await c.delete(u); } catch (e){}
  }
  saveIdx();
}
// Returns a blob: URL for the image (from the store, or downloaded and stored), or null if it can't be stored.
async function storedSrc(url){
  if (!storeOn() || !url) return null;
  let host; try { host = new URL(url, location.href).host; } catch (e){ return null; }
  if (corsBad.has(host)) return null;
  try {
    const c = await caches.open(STORE), ix = idx();
    let res = await c.match(url), blob;
    if (res){ blob = await res.blob(); }
    else {
      let r;
      try { r = await fetch(url, { mode: "cors", credentials: "omit" }); }
      catch (e){ corsBad.add(host); return null; }              // host doesn't allow it: fall back to normal loading
      if (!r.ok) return null;
      blob = await r.blob();
      if (!/^image\//i.test(blob.type) || !blob.size) return null;
      await c.put(url, new Response(blob, { headers: { "content-type": blob.type } }));
      ix[url] = [blob.size, Date.now()]; trimStore(c);
    }
    ix[url] = [blob.size, Date.now()]; saveIdx();
    return URL.createObjectURL(blob);
  } catch (e){ return null; }
}
// Image for display: stored copy if possible, else normal load (with fallback URL). Returns { src, blob }.
async function displaySrc(url, alt){
  for (const u of [url, alt].filter(Boolean)){
    if (failedSrc.has(u) && u === url && alt) continue;
    const b = await storedSrc(u);
    if (b){ try { await loadImg(b, 20000); return { src: b, blob: true }; } catch (e){ URL.revokeObjectURL(b); } }
  }
  return { src: await loadAny(url, alt), blob: false };
}
// Download the next slide's images in the background so they're ready (and stored)
async function prefetchSlide(s){
  try {
    let urls = [];
    if (s.kind === "gallery"){
      const page = pageTurns.get(s.key) || 0, g = galleryGrid(Math.min(s.per, s.files.length), 16, 9);
      urls = galleryPick(s, page).map(f => galleryUrls(f.id, g.cols));
    } else if (s.kind === "sponsor" || s.kind === "image") urls = [{ src: s.src, alt: s.alt }];
    for (const u of urls){
      const b = await storedSrc(u.src);
      if (b) URL.revokeObjectURL(b); else await loadImg(u.src).catch(() => u.alt && loadImg(u.alt)).catch(() => {});
    }
  } catch (e){}
}

/* ---------- honours ---------- */
const pageTurns = new Map();   // list -> how many times it has been shown (survives sheet refreshes)
// Honours tab columns (any order, matched by header): Name (required), No, Year/Season, Award, Details, Image
const pick = (r, keys) => { for (const k of keys){ const v = r[k]; if (v !== undefined && String(v).trim() !== "") return String(v).trim(); } return ""; };
const initials = n => { const w = String(n).replace(/'[^']*'|"[^"]*"|\([^)]*\)/g, " ").trim().split(/\s+/).filter(x => /^[a-z0-9]/i.test(x)); return ((w[0] || "?")[0] + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase(); };
function imgSrc(v, w = 600){ if (!v) return ""; const d = driveFileIdOf(v); return d ? driveImg(d).replace(/sz=w\d+/, "sz=w" + w) : /^https?:\/\//i.test(v) ? sized(v, w, w) : ""; }
const imgAlt = v => { if (!v) return ""; const d = driveFileIdOf(v); return d ? driveImgAlt(d) : fullRes(v); };
function splitDetails(t){
  return String(t || "").split(/\r?\n|\s+\|\s+|;\s*|,\s*(?=[A-Z][^,:]{1,40}:)/).map(x => x.trim()).filter(Boolean);
}
async function honoursSlides(club, link, title, secs){
  let rows, tabName = "";
  if (/^https?:\/\//i.test(link) || /\/d\/[\w-]{20,}/.test(link)) rows = await readSheet(link);
  else { tabName = link || title; if (!tabName) throw new Error("put the tab name (or a link to the tab) in Link"); rows = await readSheet(club.sheet, { sheet: tabName }); }
  const entries = rows.map(r => ({
    no: pick(r, ["no", "no.", "number", "#", "num"]),
    name: pick(r, ["name", "player", "member", "winner", "recipient"]),
    year: pick(r, ["year", "season", "inducted", "years", "date"]),
    award: pick(r, ["award", "honour", "honor", "achievement", "title", "position", "role", "category"]),
    details: pick(r, ["details", "detail", "description", "achievements", "notes", "citation"]),
    image: imgSrc(pick(r, ["image", "photo", "picture", "img", "image link", "photo link"])),
    imageAlt: imgAlt(pick(r, ["image", "photo", "picture", "img", "image link", "photo link"]))
  })).filter(e => e.name);
  if (!entries.length) throw new Error("no rows with a Name");
  const feature = entries.some(e => e.details);
  const thumbs = !feature && entries.some(e => e.image);
  const hasAward = entries.some(e => e.award);
  const L = feature ? { cols: 3, rows: 1 } : thumbs ? { cols: 2, rows: 7 } : hasAward ? { cols: 2, rows: 8 } : { cols: 3, rows: 10 };
  const per = L.cols * L.rows, pages = Math.ceil(entries.length / per), perPage = Math.ceil(entries.length / pages);
  const list = [];
  for (let p = 0; p < pages; p++){
    const chunk = entries.slice(p * perPage, (p + 1) * perPage);
    list.push({ cols: feature ? Math.min(L.cols, Math.max(chunk.length, 1)) : L.cols, rows: Math.ceil(chunk.length / L.cols), entries: chunk, page: p + 1 });
  }
  const t = title || tabName || "Honour Board";
  // One slide per list: each time it comes round it shows the next page
  return [{ kind: "honours", key: `${link}|${t}`, title: t, layout: feature ? "feature" : "board", thumbs, pageList: list, pages, secs }];
}

/* ---------- image preloading ---------- */
// If a resized image fails, retry once with the original (runs before the element's own onerror)
document.addEventListener("error", e => {
  const t = e.target;
  if (t && t.tagName === "IMG" && t.dataset.alt && !t.dataset.tried && t.dataset.alt !== t.src){
    failedSrc.add(t.getAttribute("src")); t.dataset.tried = "1"; e.stopImmediatePropagation(); t.src = t.dataset.alt;
  }
}, true);
// Recently loaded images are kept in memory (capped so TV sticks don't run out of memory);
// older ones come back from the browser's own cache
const imgCache = new Map(), keepImgs = new Map();
const failedSrc = new Set();   // resized URLs that failed: go straight to the original next time
const useSrc = (src, alt) => (alt && failedSrc.has(src)) ? alt : src;
function loadImg(src, ms = 20000){
  if (imgCache.has(src)) return imgCache.get(src);
  const p = loadImgOnce(src, ms);
  imgCache.set(src, p); p.catch(() => imgCache.delete(src));
  if (imgCache.size > 60) imgCache.delete(imgCache.keys().next().value);
  return p;
}
function loadImgOnce(src, ms){
  return new Promise((ok, fail) => {
    const img = new Image(); const t = setTimeout(() => fail(new Error("Timed out loading " + src)), ms);
    img.onload = () => { clearTimeout(t); keepImgs.set(src, img); if (keepImgs.size > 12) keepImgs.delete(keepImgs.keys().next().value); ok(src); };
    img.onerror = () => { clearTimeout(t); fail(new Error("Couldn't load " + src)); };
    img.src = src;
  });
}
async function loadAny(src, alt){ if (alt && failedSrc.has(src)) return loadImg(alt); try { return await loadImg(src); } catch (e){ if (alt){ failedSrc.add(src); return await loadImg(alt); } throw e; } }

/* ---------- ladder ---------- */
// Accepts a bare grade ID (e.g. 6075bd49-a742-47b9-8172-be5248dcf113), a full API link,
// or any PlayHQ / cricket.com.au link that contains the grade ID.
const GUID = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
function ladderUrl(v){
  v = String(v || "").trim();
  if (/^https?:\/\/grassrootsapiproxy\.cricket\.com\.au\//i.test(v)) return v;
  const m = v.match(/grades?\/([0-9a-f-]{36})/i) || v.match(GUID);
  return m ? `https://grassrootsapiproxy.cricket.com.au/fixturesladders/grades/${(m[1] || m[0]).toLowerCase()}/ladders?jsconfig=eccn%3Atrue` : "";
}
const ladderCache = new Map();
let apiRoute = null;   // route that last worked (-1 = direct, 0.. = relay index)
async function apiVia(route, url, raw, ms = 20000){
  const target = route < 0 ? url : CONFIG.LADDER_PROXIES[route] + encodeURIComponent(url);
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try {
    const res = await fetch(target, { cache: "no-store", signal: ctl.signal, credentials: "omit" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    return raw ? text : JSON.parse(text);
  } finally { clearTimeout(t); }
}
// Same as apiJSON but returns text (used to read a public Drive folder page through the relays)
async function apiText(url, ok = () => true){
  // Try direct + every relay at once and take the first good answer (much faster than one after another)
  const routes = [-1, ...CONFIG.LADDER_PROXIES.map((_, i) => i)], errs = [];
  return new Promise((resolve, reject) => {
    let left = routes.length;
    routes.forEach(r => apiVia(r, url, true, 15000)
      .then(t => { if (!ok(t)) throw new Error("got a page without the folder's files"); resolve(t); })
      .catch(e => { errs.push((r < 0 ? "direct" : "relay " + (r + 1)) + ": " + (e.name === "AbortError" ? "timed out" : e.message)); if (--left === 0) reject(new Error(errs.join("; "))); }));
  });
}
// Fetch cricket.com.au JSON, directly or via a relay. `ok` checks the response looks right.
async function apiJSON(url, ok = () => true){
  const routes = [-1, ...CONFIG.LADDER_PROXIES.map((_, i) => i)];
  if (apiRoute !== null) routes.sort((a, b) => (b === apiRoute) - (a === apiRoute));
  const errs = [];
  for (const r of routes){
    try {
      const data = await apiVia(r, url);
      if (!data || !ok(data)) throw new Error("unexpected response");
      apiRoute = r; return data;
    } catch (e){ errs.push((r < 0 ? "direct" : "relay " + (r + 1)) + ": " + e.message); }
  }
  throw new Error(errs.join("; "));
}
async function getLadder(url){
  const hit = ladderCache.get(url);
  if (hit && Date.now() - hit.t < CONFIG.LADDER_CACHE_MINUTES * 60e3) return hit;
  try {
    const data = await apiJSON(url, d => Array.isArray(d.ladders));
    const entry = { t: Date.now(), data };
    ladderCache.set(url, entry); return entry;
  } catch (e){ if (hit) return hit; throw new Error("Couldn't load ladder (" + e.message + ")"); }
}
const STAT = [
  ["played","P"],["won","W"],["lost","L"],["ties","T"],["drawn","D"],["noResults","NR"],["byes","BYE"],
  ["competitionPoints","PTS"],["pointsAverage","AVG"],["quotient","QUO"],["netRunRate","NRR"]
];
const OPTIONAL = new Set(["ties","drawn","noResults","byes"]);   // hidden when every team has 0
function fmtStat(id, v){
  if (v == null || v === "") return "–";
  if (id === "netRunRate") return (v > 0 ? "+" : "") + Number(v).toFixed(3);
  if (id === "quotient") return Number(v).toFixed(3);
  if (id === "pointsAverage") return Number(v).toFixed(2);
  return v;
}

  const org = d.grade?.organisation || {};

// page: which page/set to show for Honours/Gallery (omit to take the next one in turn)
async function makeSlide(s, club, stage, page){
  const el = document.createElement("div");
  el.className = "slide " + s.kind;
  el._blobs = [];
  const nextPage = () => { if (page !== undefined) return page; const n = pageTurns.get(s.key) || 0; pageTurns.set(s.key, n + 1); return n; };
  if (s.kind === "ladder"){
    const entry = await getLadder(s.url);
    const L = ladderHTML(entry, s, club);
    el.innerHTML = L.html; stage.appendChild(el); fitLadder(el, L.n, L.k);
  } else if (s.kind === "honours"){
    const n = nextPage(); el._page = n;
    const pg = s.pageList[n % s.pageList.length];
    el.innerHTML = honoursHTML({ ...s, ...pg }, club); stage.appendChild(el);
    await Promise.all([...el.querySelectorAll("img")].map(i => i.complete ? 0 : new Promise(r => { i.addEventListener("load", r); i.addEventListener("error", () => setTimeout(r, 0)); setTimeout(r, 8000); })));
    fitHonours(el);
  } else if (s.kind === "gallery"){
    const n = nextPage(); el._page = n;
    const picks = galleryPick(s, n);
    const g = galleryGrid(picks.length, stage.clientWidth || 16, stage.clientHeight || 9);
    const got = await Promise.all(picks.map(f => { const u = galleryUrls(f.id, g.cols); return displaySrc(u.src, u.alt).catch(() => null); }));
    if (!got.some(Boolean)) throw new Error("gallery images couldn't be loaded");
    got.forEach(x => x && x.blob && el._blobs.push(x.src));
    el.innerHTML = `<div class="g-grid${picks.length === 1 ? " one" : ""}" style="--cols:${g.cols};--rows:${g.rows};height:100%">${got.map(x => x
      ? `<div class="g-tile"><div class="blur" style="background-image:url('${esc(x.src)}')"></div><img src="${esc(x.src)}" alt=""></div>`
      : `<div class="g-tile"></div>`).join("")}</div>`;
    stage.appendChild(el);
  } else if (s.kind === "sponsor"){
    const d = await displaySrc(s.src, s.alt), src = d.src; if (d.blob) el._blobs.push(src);
    const lines = String(s.details || "").split("|").map(x => x.trim()).filter(Boolean);
    const imgH = Math.max(15, 27 - lines.length * 3.2);
    el.innerHTML = `<div class="s-kicker">${esc(CONFIG.SPONSOR_HEADING)}</div><div class="s-panel"><img src="${esc(src)}" alt="Sponsor" style="height:${imgH}rem"></div>` +
      (lines.length ? `<div class="s-details">${lines.map((l, i) => `<div class="${i === 0 ? "first" : ""}">${esc(l)}</div>`).join("")}</div>` : "");
    stage.appendChild(el);
  } else {
    const d = await displaySrc(s.src, s.alt), src = d.src; if (d.blob) el._blobs.push(src);
    el.innerHTML = `<div class="blur" style="background-image:url('${esc(src)}')"></div><img class="main" src="${esc(src)}" alt="">`;
    stage.appendChild(el);
  }
  return el;
}

/* ---------- scores ticker ---------- */
const API = "https://grassrootsapiproxy.cricket.com.au";
const Q = "jsconfig=eccn%3Atrue";
const FINAL = /COMPLET|ABANDON|FORFEIT|CANCEL|WASH|NO.?RESULT|DRAWN|WALKOVER/i;
const PRE = /UPCOMING|SCHEDUL|POSTPON|NOT.?STARTED|FIXTURE/i;
const titleCase = t => String(t || "").toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()).replace(/\b(\d+)(St|Nd|Rd|Th)s?\b/g, (m) => m.toLowerCase()).replace(/\bT20\b/i, "T20");
const dayKey = d => new Date(d).toLocaleDateString("en-AU");
const lastDay = m => { const ds = (m.matchSchedule || []).map(x => Date.parse(x.startDateTime)).filter(Boolean); return ds.length ? Math.max(...ds) : 0; };
const firstDay = m => { const ds = (m.matchSchedule || []).map(x => Date.parse(x.startDateTime)).filter(Boolean); return ds.length ? Math.min(...ds) : 0; };

async function clubStructure(orgId){
  const sj = await apiJSON(`${API}/fixturesladders/organisations/${orgId}/seasons?${Q}`, d => Array.isArray(d.seasons) || Array.isArray(d));
  const seasons = (Array.isArray(sj) ? sj : sj.seasons).slice().sort((a, b) => Date.parse(b.startDate) - Date.parse(a.startDate));
  const cur = seasons.find(x => x.isCurrentSeason) || seasons[0];
  const prev = seasons.find(x => x !== cur && Date.parse(x.startDate) < Date.parse(cur.startDate));
  const teamsOf = async season => {
    if (!season) return null;
    const tj = await apiJSON(`${API}/fixturesladders/organisations/${orgId}/teams?seasonId=${season.id}&${Q}`, d => Array.isArray(d.teams));
    const grades = new Map();
    tj.teams.forEach((t, i) => (t.grades?.length ? t.grades : [t.grade]).filter(Boolean).forEach(g => { if (!grades.has(g.id)) grades.set(g.id, { id: g.id, name: g.name, order: i }); }));
    return { season, grades: [...grades.values()] };
  };
  return { cur: await teamsOf(cur), prev: prev ? () => teamsOf(prev) : null };
}

async function seasonItems(orgId, info){
  const now = Date.now(), today = dayKey(now);
  const all = await Promise.all(info.grades.map(g =>
    apiJSON(`${API}/scores/grades/${g.id}/matches?${Q}`, d => Array.isArray(d.matches))
      .then(d => d.matches.map(m => ({ m, g }))).catch(e => { warn(`Scores for ${g.name}: ${e.message}`); return []; })));
  const seen = new Set(), live = [], latest = new Map();
  for (const { m, g } of all.flat()){
    if (seen.has(m.id)) continue; seen.add(m.id);
    const mine = (m.teams || []).filter(t => String(t.owningOrganisation?.id || "").toLowerCase() === orgId);
    if (!mine.length) continue;
    const st = String(m.status || "");
    const batting = (m.teams || []).some(t => t.isBatting);
    const started = firstDay(m) && firstDay(m) <= now;
    const isFinal = FINAL.test(st), isPre = PRE.test(st) && !batting;
    if (!isFinal && !isPre && (started || batting)){
      const playingToday = (m.matchSchedule || []).some(x => dayKey(Date.parse(x.startDateTime)) === today);
      live.push({ kind: playingToday ? "live" : "prog", m, g, mine, sort: g.order });
    } else if (isFinal){
      for (const t of mine){
        const prevBest = latest.get(t.id);
        if (!prevBest || lastDay(m) > lastDay(prevBest.m)) latest.set(t.id, { kind: "result", m, g, mine: [t], sort: g.order });
      }
    }
  }
  const results = [...latest.values()].sort((a, b) => a.sort - b.sort || lastDay(b.m) - lastDay(a.m));
  live.sort((a, b) => a.sort - b.sort);
  await Promise.all(live.filter(it => it.kind === "live").map(async it => {
    try {
      const card = await apiJSON(`${API}/scores/matches/${it.m.id}?responseModifier=includeScorecard&${Q}`, d => d && d.id);
      const upd = card.matchSummary?.teams || [];
      for (const t of it.m.teams || []){ const u = upd.find(x => x.id === t.id); if (u && u.scoreText !== undefined){ t.scoreText = u.scoreText; t.isBatting = !!u.isBatting; } }
      it.players = livePlayers(card, it.m);
    } catch (e){ warn("Live scorecard: " + e.message); }
  }));
  // Is the club playing today (or within the next 2 hours)? Decides how often scores are checked.
  const matchDay = all.flat().some(({ m }) => (m.teams || []).some(t => String(t.owningOrganisation?.id || "").toLowerCase() === orgId)
    && !FINAL.test(String(m.status || "")) && (m.matchSchedule || []).some(x => { const d = Date.parse(x.startDateTime); return dayKey(d) === today || (d > now && d - now < 2 * 3600e3); }));
  return { live, results, matchDay };
}

// Batters at the crease + current bowler from a match scorecard
function livePlayers(card, m){
  const inns = (card.innings || []).slice().sort((a, b) => (a.inningsOrder ?? a.inningsNumber ?? 0) - (b.inningsOrder ?? b.inningsNumber ?? 0));
  if (!inns.length) return null;
  const batTeam = ((card.matchSummary?.teams) || card.teams || m.teams || []).find(t => t.isBatting);
  const cur = (batTeam && [...inns].reverse().find(i => i.battingTeamId === batTeam.id)) || inns[inns.length - 1];
  const bat = cur.batting || [], bowl = cur.bowling || [];
  let crease = bat.filter(b => b.isOnStrike || b.isOnNonStrike);
  if (!crease.length) crease = bat.filter(b => (b.dismissalTypeId === 1 || /^not out$/i.test(b.dismissalType || "")) && !/did not|dnb/i.test(b.dismissalText || "")).slice(-2);
  crease.sort((a, b) => (b.isOnStrike ? 1 : 0) - (a.isOnStrike ? 1 : 0) || (a.batOrder || 0) - (b.batOrder || 0));
  const bowler = bowl.find(b => b.isBowling);
  if (!crease.length && !bowler) return null;
  return { crease: crease.slice(0, 2), bowler };
}
function playersHTML(pl){
  if (!pl) return "";
  const bats = pl.crease.map(b => `<span class="tk-bat${b.isOnStrike ? " strike" : ""}">${esc(b.playerShortName || "")}<b>${esc(b.runsScored ?? 0)}*</b><small>(${esc(b.ballsFaced ?? 0)})</small></span>`).join("");
  const w = pl.bowler;
  const bowl = w ? `<span class="tk-bowl"><i>Bowling</i>${esc(w.playerShortName || "")}<b>${esc(w.wicketsTaken ?? 0)}/${esc(w.runsConceded ?? 0)}</b><small>(${esc(w.oversBowled ?? 0)} ov${w.maidensBowled ? `, ${esc(w.maidensBowled)} m` : ""})</small></span>` : "";
  return `<span class="tk-pl">${bats}${bowl}</span>`;
}

function tickerItemHTML(it, seasonLabel){
  const { m, g } = it, meId = it.mine[0].id;
  const teams = (m.teams || []).slice().sort((a, b) => (b.id === meId) - (a.id === meId));
  const [me, opp] = teams;
  const score = t => t ? `${esc(t.displayName)}${t.scoreText ? ` <b>${esc(t.scoreText)}${it.kind !== "result" && t.isBatting ? "*" : ""}</b>` : ""}` : "";
  let badge;
  if (it.kind === "live") badge = `<span class="tk-badge live">Live</span>`;
  else if (it.kind === "prog") badge = `<span class="tk-badge prog">In progress</span>`;
  else if (me.isWinner) badge = `<span class="tk-badge won">Won</span>`;
  else if (opp && opp.isWinner) badge = `<span class="tk-badge lost">Lost</span>`;
  else badge = `<span class="tk-badge draw">${/ABANDON/i.test(m.status) && !/drawn/i.test(m.resultText || "") ? "Abandoned" : "Draw"}</span>`;
  const round = m.round?.shortName ? `${esc(m.round.shortName)} · ` : "";
  const res = m.resultText && !/\(local time\)/i.test(m.resultText) ? `<span class="tk-res">${esc(m.resultText)}</span>` : "";
  return `<span class="tk-item">${badge}<span class="tk-grade">${seasonLabel ? esc(seasonLabel) + " · " : ""}${round}${esc(titleCase(g.name))}</span>` +
    `<span class="tk-team me">${score(me)}</span>${opp ? `<span class="tk-v">v</span><span class="tk-team">${score(opp)}</span>` : ""}${it.players ? playersHTML(it.players) : res}</span><span class="tk-sep">◆</span>`;
}

function startTicker(club, bar){
  if (!CONFIG.TICKER || !club.pcId) return;
  const box = document.createElement("div");
  box.className = "ticker"; box.hidden = true;
  box.innerHTML = `<div class="tk-track"></div>`;
  bar.querySelector(".dots").before(box);
  const track = box.firstElementChild;
  let pending = null, structure = null, structT = 0, reps = 1;

  const apply = html => {
    const one = `<div class="tk-set">${html}</div>`;
    track.innerHTML = one;
    const set = track.firstElementChild;
    reps = 1;
    while (set.offsetWidth < box.clientWidth && reps < 20){ set.insertAdjacentHTML("beforeend", html); reps++; }
    track.insertAdjacentHTML("beforeend", `<div class="tk-set" aria-hidden="true">${set.innerHTML}</div>`);
    const root = parseFloat(getComputedStyle(document.documentElement).fontSize);
    track.style.setProperty("--tkdur", Math.max(8, set.offsetWidth / (root * CONFIG.TICKER_SPEED)) + "s");
    track.style.animation = "none"; void track.offsetWidth; track.style.animation = "";
  };
  track.addEventListener("animationiteration", () => { if (pending !== null){ const h = pending; pending = null; apply(h); } });
  // Swap updated live scores in without restarting the scroll
  const applyInPlace = html => {
    const sets = track.querySelectorAll(".tk-set");
    if (sets.length !== 2){ apply(html); return; }
    const before = sets[0].offsetWidth;
    sets.forEach(x => x.innerHTML = html.repeat(reps));
    const after = sets[0].offsetWidth;
    if (after < box.clientWidth || Math.abs(after - before) / before > 0.25) pending = html;   // big change: rebuild at end of loop
  };
  const show = (html, inPlace) => {
    if (box.hidden){ box.hidden = false; bar.classList.add("has-ticker"); apply(html); }
    else if (html !== box.dataset.last){ if (inPlace) applyInPlace(html); else pending = html; }
    box.dataset.last = html;
  };

  async function refresh(){
    try {
      if (!structure || Date.now() - structT > 6 * 3600e3){ structure = await clubStructure(club.pcId); structT = Date.now(); }
      let label = "", data = structure.cur ? await seasonItems(club.pcId, structure.cur) : { live: [], results: [] };
      if (!data.live.length && !data.results.length && structure.prev){
        if (typeof structure.prev === "function") structure.prev = await structure.prev();
        if (structure.prev){ data = await seasonItems(club.pcId, structure.prev); label = structure.prev.season.name.replace(/^Summer\s*/i, ""); }
      }
      hasLive = data.live.length > 0; matchDay = !!data.matchDay; liveItems = data.live; lastFull = Date.now();
      const items = data.live.length ? data.live : data.results;   // live games take over the ticker while any are on
      if (!items.length){ box.hidden = true; bar.classList.remove("has-ticker"); return; }
      show(items.map(it => tickerItemHTML(it, it.kind === "result" ? label : "")).join(""), hasLive && wasLive);
      wasLive = hasLive;
    } catch (e){ warn("Scores ticker: " + e.message); }
  }
  // Fast path while live: only re-read the live matches' scorecards
  async function liveRefresh(){
    let ended = false;
    await Promise.all(liveItems.filter(it => it.kind === "live").map(async it => {
      try {
        const card = await apiJSON(`${API}/scores/matches/${it.m.id}?responseModifier=includeScorecard&${Q}`, d => d && d.id);
        const upd = card.matchSummary?.teams || card.teams || [];
        for (const t of it.m.teams || []){
          const u = upd.find(x => x.id === t.id);
          if (u){ if (u.scoreText !== undefined) t.scoreText = u.scoreText; t.isBatting = !!u.isBatting; t.isWinner = !!u.isWinner; }
        }
        if (card.status){ it.m.status = card.status; if (FINAL.test(card.status)) ended = true; }
        if (card.matchSummary?.resultText) it.m.resultText = card.matchSummary.resultText;
        it.players = livePlayers(card, it.m);
      } catch (e){ warn("Live scorecard: " + e.message); }
    }));
    if (ended) return refresh();   // a game finished: do a full check straight away
    show(liveItems.map(it => tickerItemHTML(it, "")).join(""), true);
  }
  let hasLive = false, wasLive = false, matchDay = false, liveItems = [], lastFull = 0;
  (async function loop(){
    if (hasLive && Date.now() - lastFull < CONFIG.TICKER_REFRESH_MINUTES * 60e3) await liveRefresh();
    else await refresh();
    setTimeout(loop, hasLive ? CONFIG.TICKER_LIVE_REFRESH_SECONDS * 1000 : (matchDay ? CONFIG.TICKER_REFRESH_MINUTES : CONFIG.TICKER_IDLE_REFRESH_MINUTES) * 60e3);
  })();
}

/* ---------- screens ---------- */
function notice(title, msg, back){
  app.innerHTML = `<div class="backdrop"></div><div class="notice"><div class="box"><h2>${esc(title)}</h2><p>${esc(msg)}</p>${back ? `<a href="${esc(location.pathname)}">‹ Back to club list</a>` : ""}</div></div>`;
}

// Find a working copy of the RKT logo once, then reuse it (keeps it cached for the splash)
let rktLogoSrc = null;
const rktLogoReady = (async () => {
  for (const u of [].concat(CONFIG.RKT_LOGO || [])){
    try { rktLogoSrc = await loadImg(u, 15000); return rktLogoSrc; } catch (e){ console.warn("[RKT TV] logo not at", u); }
  }
  warn("RKT Sport logo couldn't be loaded from any address");
  return null;
})();
const rktLogo = () => rktLogoSrc
  ? `<img src="${esc(rktLogoSrc)}" alt="RKT Sport" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'txt',textContent:'RKT SPORT'}))">`
  : `<div class="txt">RKT SPORT</div>`;

async function makeSplash(stage){
  await Promise.race([rktLogoReady, sleep(4000)]);
  const el = document.createElement("div");
  el.className = "slide splash";
  el.innerHTML = `
    <div class="sp-badge">${rktLogo()}</div>
    <h2>Automate your club screens</h2>
    <p>Engaging content for your sponsors and supporters</p>
    <div class="sp-mail">${esc(CONFIG.RKT_EMAIL)}</div>`;
  stage.appendChild(el);
  return el;
}

function renderMenu(clubs){
  document.documentElement.classList.add("menu");
  app.innerHTML = `
    <div class="backdrop"></div>
    <div class="menu-wrap">
      <div class="menu-head">
        <div class="brand"><div class="brand-badge">${rktLogo()}</div><div><div class="kicker">Club TV</div><h1>RKT TV</h1></div></div>
        <p>Pick a club to start its screen. Bookmark the club's page on the TV and it will open straight into the rotation.</p>
      </div>
      <div class="grid">${clubs.map(c => `
        <a class="card" style="${varStyle(c)}" href="?club=${encodeURIComponent(c.name)}">
          <div class="logo">${c.logo ? `<img src="${esc(c.logo)}" data-alt="${esc(c.logoAlt || "")}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:${esc(JSON.stringify(c.name.charAt(0)))}}))">` : `<span>${esc(c.name.charAt(0))}</span>`}</div>
          <div class="name">${esc(c.name)}</div>
          <div class="go">Start screen ›</div>
        </a>`).join("")}
      </div>
      <div class="menu-foot"><span>Powered by <strong>RKT Sport</strong>: automate your club screens</span><a href="mailto:${esc(CONFIG.RKT_EMAIL)}">${esc(CONFIG.RKT_EMAIL)}</a></div>
    </div>`;
}

async function runClub(club){
  document.title = `${club.name} · RKT TV`;
  document.body.classList.add("tv-mode");
  applyTheme(document.documentElement, club);
  app.innerHTML = `
    <div class="backdrop"></div>
    <div class="tv">
      <div class="stage" id="stage"></div>
      <div class="bar">
        <div class="progress" id="prog"></div>
        ${club.logo ? `<img class="blogo" src="${esc(club.logo)}" data-alt="${esc(club.logoAlt || "")}" alt="" onerror="this.remove()">` : ""}
        <div class="club">${esc(club.name)}</div>
        <div class="dots" id="dots"></div>
        <div class="clock" id="clock"></div>
      </div>
    </div>
    <div class="ctrl"><a class="btn" href="${esc(location.pathname)}">‹ Clubs</a><button class="btn" id="bk" title="Back (←)">⏮ Back</button><button class="btn" id="pp" title="Pause / play (space)">⏸ Pause</button><button class="btn" id="nx" title="Next (→)">Next ⏭</button><button class="btn" id="fs">Full screen</button><button class="btn" id="setw">Set width</button></div>
    <div class="paused">❚❚ Paused</div>
    <div class="wpanel" id="wpanel" hidden>
      <label for="wval">Display width in pixels</label>
      <div class="row"><input id="wval" inputmode="numeric" placeholder="e.g. 1280 or 1280x400"></div>
      <small>Height scales to 16:9 automatically. Type WIDTHxHEIGHT (e.g. 1280x400) to set both. Leave blank to fill the screen.</small>
      <div class="row"><button class="btn" id="wapply">Apply</button><button class="btn" id="wreset">Fill screen</button><button class="btn" id="wclose">Close</button></div>
    </div>
    <div class="toast" id="toast"></div>`;
  const stage = document.getElementById("stage"), prog = document.getElementById("prog"), dots = document.getElementById("dots");

  startTicker(club, document.querySelector(".bar"));
  const tick = () => document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" });
  tick(); setInterval(tick, 1000);

  let idleT; const wake = () => { document.body.classList.add("awake"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.remove("awake"), 2500); };
  addEventListener("mousemove", wake); addEventListener("touchstart", wake);
  const fullscreen = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
  document.getElementById("fs").onclick = fullscreen;
  const wp = document.getElementById("wpanel"), wv = document.getElementById("wval");
  const closePanel = () => { wp.hidden = true; document.body.classList.remove("panel-open"); };
  document.getElementById("setw").onclick = () => {
    wp.hidden = !wp.hidden; document.body.classList.toggle("panel-open", !wp.hidden);
    const cur = displaySize(); wv.value = cur ? (cur.custom ? `${cur.w}x${cur.h}` : cur.w) : ""; if (!wp.hidden) wv.focus();
  };
  document.getElementById("wapply").onclick = () => { setDisplaySize(wv.value); closePanel(); };
  document.getElementById("wreset").onclick = () => { setDisplaySize(""); closePanel(); };
  document.getElementById("wclose").onclick = closePanel;
  wv.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter"){ setDisplaySize(wv.value); closePanel(); } if (e.key === "Escape") closePanel(); });

  let slides = [], idx = -1, lastLoad = 0, fails = 0, rotations = 0;

  // ---- timing with pause support ----
  let paused = false, timer = null, resolveWait = null, waitStart = 0, waitMs = 0, remain = 0, autoResume = null, nav = null;
  const finish = () => { clearTimeout(timer); timer = null; const r = resolveWait; resolveWait = null; if (r) r(); };
  const wait = ms => new Promise(r => { resolveWait = r; waitMs = ms; waitStart = Date.now(); if (paused) remain = ms; else timer = setTimeout(finish, ms); });
  const ppBtn = document.getElementById("pp");
  function pause(){
    if (paused) return; paused = true; document.body.classList.add("is-paused"); ppBtn.textContent = "▶ Play";
    if (timer){ clearTimeout(timer); timer = null; remain = Math.max(0, waitMs - (Date.now() - waitStart)); }
    const w = getComputedStyle(prog).width; prog.style.transition = "none"; prog.style.width = w;
    clearTimeout(autoResume);
    if (CONFIG.PAUSE_RESUME_MINUTES > 0) autoResume = setTimeout(play, CONFIG.PAUSE_RESUME_MINUTES * 60e3);
  }
  function play(){
    if (!paused) return; paused = false; document.body.classList.remove("is-paused"); ppBtn.textContent = "⏸ Pause"; clearTimeout(autoResume);
    if (resolveWait){ waitStart = Date.now(); waitMs = remain; timer = setTimeout(finish, remain);
      void prog.offsetWidth; prog.style.transition = `width ${remain / 1000}s linear`; prog.style.width = "100%"; }
  }
  const togglePause = () => paused ? play() : pause();
  const goNext = () => { nav = "fwd"; finish(); };
  const goBack = () => { if (hpos > 0){ nav = "back"; finish(); } };
  document.getElementById("bk").onclick = goBack;
  document.getElementById("nx").onclick = goNext;
  ppBtn.onclick = togglePause;
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight") goNext();
    else if (e.key === "ArrowLeft") goBack();
    else if (e.key === " " || e.key === "p" || e.key === "P"){ e.preventDefault(); togglePause(); }
    else if (e.key === "f" || e.key === "F") fullscreen();
    else if (e.key === "m" || e.key === "M") location.href = location.pathname;
  });

  const stageNotice = (t, m) => { stage.innerHTML = `<div class="notice"><div class="box"><h2>${esc(t)}</h2><p>${esc(m)}</p></div></div>`; dots.innerHTML = ""; prog.style.transition = "none"; prog.style.width = "0"; };
  const drawDots = () => { dots.innerHTML = slides.length <= 24 ? slides.map(() => `<div class="dot"></div>`).join("") : ""; };
  const show = el => {
    stage.querySelectorAll(".notice").forEach(n => n.remove());
    const old = [...stage.querySelectorAll(".slide.on")];
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
    old.forEach(o => { o.classList.remove("on"); setTimeout(() => { (o._blobs || []).forEach(u => URL.revokeObjectURL(u)); o.remove(); }, 1000); });
  };
  const progress = secs => {
    prog.style.transition = "none"; prog.style.width = "0"; void prog.offsetWidth;
    if (paused){ return; }
    prog.style.transition = `width ${secs}s linear`; prog.style.width = "100%";
  };
  const markDot = i => dots.querySelectorAll(".dot").forEach((d, j) => d.classList.toggle("on", j === i));

  // ---- history (for Back) ----
  let hist = [], hpos = -1;

  while (true){
    // Back / forward through slides already shown
    if (nav === "back" || (nav === "fwd" && hpos < hist.length - 1)){
      hpos += nav === "back" ? -1 : 1; nav = null;
      const h = hist[hpos];
      let el;
      try { el = await makeSlide(h.s, club, stage, h.page); }
      catch (e){ warn("Couldn't re-show that slide: " + e.message); continue; }
      show(el); markDot(h.i); progress(h.s.secs);
      await wait(h.s.secs * 1000);
      continue;
    }
    nav = null;
    if (idx + 1 >= slides.length){
      if (idx >= 0 && slides.length && CONFIG.SPLASH_EVERY > 0 && ++rotations % CONFIG.SPLASH_EVERY === 0){
        show(await makeSplash(stage));
        dots.querySelectorAll(".dot").forEach(d => d.classList.remove("on"));
        progress(CONFIG.SPLASH_SECONDS);
        await wait(CONFIG.SPLASH_SECONDS * 1000);
        if (nav === "back"){ continue; }
        nav = null;
      }
      idx = -1;
      if (!slides.length || Date.now() - lastLoad >= CONFIG.REFRESH_MINUTES * 60e3){
        if (!slides.length) stageNotice(`Loading ${club.name}…`, "Reading the club's sheet and content.");
        try { slides = await buildSlides(club); lastLoad = Date.now(); drawDots(); }
        catch (e){
          if (!slides.length){ stageNotice(`Can't load ${club.name}'s screen`, e.message + " Retrying shortly…"); await sleep(60e3); continue; }
          warn(e.message);
        }
      }
      if (!slides.length){
        if (buildIssues.length) stageNotice("Nothing could be shown", buildIssues.join(" • ") + " — Checking again shortly…");
        else stageNotice("Nothing to show yet", `Add rows with Active = 1 to ${club.name}'s sheet. Checking again shortly…`);
        lastLoad = 0; await sleep(60e3); continue;
      }
    }
    idx++;
    const s = slides[idx];
    let el;
    try { el = await makeSlide(s, club, stage); fails = 0; }
    catch (e){
      warn(`Slide ${idx + 1} skipped: ${e.message}`);
      if (++fails >= slides.length){ stageNotice("Can't show any slides", e.message + " Retrying shortly…"); fails = 0; lastLoad = 0; idx = slides.length; await sleep(30e3); }
      continue;
    }
    hist = hist.slice(0, hpos + 1); hist.push({ s, page: el._page, i: idx });
    if (hist.length > 60) hist.shift();
    hpos = hist.length - 1;
    show(el); markDot(idx); progress(s.secs);
    const upcoming = slides[idx + 1] || slides[0];
    if (upcoming) setTimeout(() => prefetchSlide(upcoming), 1500);
    await wait(s.secs * 1000);
  }
}

/* ---------- fixed display size (Set width) ---------- */
// Stored in the address (?width=1280 or ?width=1280x400) so it can be bookmarked, and remembered on this device.
function parseSize(v){
  const m = String(v || "").trim().match(/^(\d{2,5})(?:\s*[x×*,]\s*(\d{2,5}))?$/i);
  if (!m) return null;
  const w = +m[1], h = m[2] ? +m[2] : Math.round(w * 9 / 16);
  return { w, h, custom: !!m[2] };
}
function displaySize(){
  let v = params.get("width");
  if (v === null){ try { v = localStorage.getItem("rkttv-width"); } catch (e){} }
  return parseSize(v);
}
function applyDisplaySize(){
  const sz = displaySize(), root = document.documentElement;
  if (!sz){ root.classList.remove("fixed"); return; }
  root.classList.add("fixed");
  root.style.setProperty("--W", sz.w + "px"); root.style.setProperty("--H", sz.h + "px");
  root.style.setProperty("--fs0", Math.min(sz.w / 100, sz.h / 56.25) + "px");
}
function setDisplaySize(v){
  const sz = parseSize(v);
  if (String(v || "").trim() && !sz){ alert("Enter a width in pixels, e.g. 1280, or WIDTHxHEIGHT, e.g. 1280x400"); return; }
  const val = sz ? (sz.custom ? `${sz.w}x${sz.h}` : String(sz.w)) : null;
  try { val ? localStorage.setItem("rkttv-width", val) : localStorage.removeItem("rkttv-width"); } catch (e){}
  if (val) params.set("width", val); else params.delete("width");
  history.replaceState(null, "", location.pathname + (params.toString() ? "?" + params : ""));
  // Rebuild so everything re-measures at the new size
  location.reload();
}

/* ---------- start ---------- */
(async function main(){
  if (params.get("club")) applyDisplaySize();
  if (!CONFIG.MASTER_SHEET || CONFIG.MASTER_SHEET.startsWith("PASTE"))
    return notice("Almost there", "Open this HTML file in a text editor and paste the link to your RKT TV Master sheet into MASTER_SHEET near the top of the script.");
  let clubs;
  try { clubs = (await readSheet(CONFIG.MASTER_SHEET)).filter(r => String(r.club || "").trim()).map(clubFromRow); }
  catch (e){ notice("Can't read the master sheet", e.message + " Retrying in a minute…"); setTimeout(() => location.reload(), 60e3); return; }
  const want = params.get("club");
  if (!want){ await Promise.race([rktLogoReady, sleep(4000)]); return renderMenu(clubs); }
  const club = clubs.find(c => c.name.toLowerCase() === want.trim().toLowerCase());
  if (!club) return notice("Club not found", `There's no club called "${want}" in the master sheet.`, true);
  runClub(club);
})();
