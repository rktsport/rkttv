# Builds the RKT TV Android app (APK) whenever anything in the android/ folder changes,
# or when you press "Run workflow" on the Actions tab.
name: Build RKT TV app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk RKT-TV.apk

      - name: Make it downloadable
        uses: actions/upload-artifact@v4
        with:
          name: RKT-TV-app
          path: RKT-TV.apk
