plugins { id 'com.android.application' }

android {
    namespace 'au.rktsport.rkttv'
    compileSdk 34

    defaultConfig {
        applicationId 'au.rktsport.rkttv'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Fixed signing key so new versions install over old ones without uninstalling
    signingConfigs {
        release {
            storeFile file('rkttv.jks')
            storePassword 'rkttv-store'
            keyAlias 'rkttv'
            keyPassword 'rkttv-store'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
